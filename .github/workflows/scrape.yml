name: Weekly competitor rates

# Where it runs:
#   - By default on GitHub's servers. NRMA's firewall blocks those, so NRMA is
#     skipped there and the report covers KTP vs Discovery.
#   - Set the repository variable RUNNER to "self-hosted" (Settings -> Secrets
#     and variables -> Actions -> Variables) once a self-hosted runner on a
#     KTP / home computer is connected, and NRMA is included automatically.
#   - PARKS (optional variable) overrides the park list, e.g. "ktp,discovery,nrma".

on:
  schedule:
    # Sunday 20:00 UTC = Monday 6am AEST / 7am AEDT
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      end:
        description: 'Collect rates up to (YYYY-MM-DD)'
        default: '2028-12-31'
      email:
        description: 'Send the email'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: competitor-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          if [ "${{ runner.environment }}" = "github-hosted" ] && [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
            sudo apt-get install -y xvfb > /dev/null
          else
            python -m playwright install chromium
          fi

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Collect, compare, report
        env:
          PARKS: ${{ vars.PARKS || (vars.RUNNER && 'ktp,discovery,nrma' || 'ktp,discovery') }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: |
          ARGS="--end ${{ github.event.inputs.end || '2028-12-31' }} --only $PARKS"
          if [ "${{ github.event.inputs.email }}" = "false" ]; then ARGS="$ARGS --no-email"; fi
          echo "Parks: $PARKS"
          # a virtual display (when available) lets the fallback browser run like a normal one
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a python run.py $ARGS
          else
            python run.py $ARGS
          fi

      - name: Save report as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-rates-${{ github.run_number }}
          path: reports/
          retention-days: 90

      - name: Commit data and report
        if: always()
        run: |
          git config user.name "ktp-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --quiet --cached || git commit -m "Competitor rates $(TZ=Australia/Sydney date +%F)"
          git pull --rebase -q || true
          git push
