name: Weekly competitor rates

on:
  schedule:
    # Sunday 20:00 UTC = Monday 6am AEST / 7am AEDT
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead to price'
        default: '120'
      email:
        description: 'Send the email'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: competitor-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb > /dev/null

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Collect, compare, report
        id: run
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '120' }}"
          if [ "${{ github.event.inputs.email }}" = "false" ]; then ARGS="$ARGS --no-email"; fi
          # virtual display so the fallback browser runs like a normal one
          xvfb-run -a python run.py $ARGS

      - name: Save report as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-rates-${{ github.run_number }}
          path: reports/
          retention-days: 90

      - name: Commit data and report
        if: always()
        run: |
          git config user.name "ktp-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --quiet --cached || git commit -m "Competitor rates $(TZ=Australia/Sydney date +%F)"
          git push
